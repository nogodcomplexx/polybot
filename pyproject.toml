[project]
name = "polybot"
version = "0.1.0"
description = "Polymarket prediction trading bot with news-driven analysis"
requires-python = ">=3.11"
dependencies = [
    "py-clob-client>=0.34.6",
    "httpx>=0.27.0",
    "websockets>=13.0",
    "transformers>=4.40.0",
    "torch>=2.2.0",
    "feedparser>=6.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "rich>=13.7.0",
    "apscheduler>=3.10.0",
    "aiosqlite>=0.20.0",
    "aiohttp>=3.9.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
