# ============================================================
# BYBIT V5 LINEAR PERPETUAL QUANTITATIVE SCALPER CONFIGURATION
# ============================================================

# -- Operational Mode & Execution Venue --
bybit:
  mode: "paper"                        # "paper" (simulation) or "live" (real capital execution)
  testnet: true                        # Set to false for Bybit production mainnet
  default_leverage: 10                 # 10x Isolated margin
  margin_mode: "ISOLATED"              # ISOLATED (enforced institutional standard)
  post_only: true                      # Maker orders only to capture fee rebates & avoid taker slippage
  max_position_usd: 100.0              # Max position notional per scalp trade
  starting_equity: 1000.0              # Account reference baseline for drawdown and high watermark tracking

  # -- Dynamic Universe Discovery & Rotation --
  universe:
    mode: "dynamic"                    # "dynamic" for auto top-N liquid pairs, "static" for fixed list
    top_n: 20                          # Number of perpetuals to actively monitor and rank
    min_turnover_usd: 50000000         # $50M 24h turnover floor to guarantee tight spreads and depth
    max_spread_pct: 0.04               # 0.04% maximum allowed spread
    min_volatility_pct: 2.5            # 2.5% minimum 24h price range (high-volatility opportunity)
    rotation_interval_hours: 2.0       # Re-evaluate and rotate candidate pool every 2 hours
    pinned_symbols:                    # Permanently retained macro anchors
      - "BTCUSDT"
      - "ETHUSDT"

  symbols: []                          # Fallback only (empty = dynamically populated by top 20 liquid pairs)

# ============================================================
# CROSS-EXCHANGE MARKET INTELLIGENCE (BINANCE & COINGLASS)
# ============================================================

binance:
  enabled: true                        # Enable Binance USDT-M Futures cross-exchange stream
  follow_universe: true                # Automatically mirrors Bybit Top 20 dynamic universe
  symbols: []                          # Optional static override (empty = mirrors dynamic universe)

coinglass:
  enabled: false                        # Enable CoinGlass contextual derivatives tracking (Optional)
  api_key: ""                          # Optional: enter API key or set COINGLASS_API_KEY in .env
  poll_interval_sec: 60.0              # Periodic poll interval for aggregate OI & funding spreads
